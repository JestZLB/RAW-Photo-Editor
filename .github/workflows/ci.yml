name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web (typecheck + tests + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # package.json declares packageManager; keep the two in sync.
          bun-version: 1.3.14

      - name: Install
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test:web

      - name: Build
        run: bun run build

  rust:
    name: Rust (clippy + tests)
    # The Tauri crate needs the Windows WebView2 toolchain, which windows-latest
    # provides out of the box.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # `cargo test` builds and runs the unit and integration suites. The two
      # ignored cases need real RAW samples and stay opt-in (see README).
      - name: Tests
        run: cargo test --workspace
